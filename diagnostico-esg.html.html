<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radar ESG Smart EcoVila</title>
<meta name="description" content="Diagnóstico de maturidade ESG para organizações, com gráfico teia do resultado.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F2F6F0; --surface:#FFFFFF; --surface-2:#E7EFE4; --ink:#16241D; --ink-2:#4A5C51; --line:#D3DFD0;
  --forest:#1B3A2F; --green:#2E7D46; --leaf:#3F9A5A; --olive:#8BA81A; --olive-ink:#5E7310;
  --accent:#2E7D46; --accent-ink:#FFFFFF; --focus:#8BA81A;
  --e:#2E7D46; --s:#C0612B; --g:#2F6FA3; --p:#6B6F66;
  --bad:#B4412F; --warn:#B7861A; --good:#2E7D46;
  --grid:#C9D6C5; --fill:rgba(46,125,70,.22);
  --radius:10px;
  --font-display:"Sora", "Segoe UI", system-ui, sans-serif;
  --font-body:"Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1813; --surface:#15231C; --surface-2:#1C2E25; --ink:#E3ECE5; --ink-2:#A3B5A9; --line:#2A3F33;
    --forest:#CFE3D4; --green:#5DBB7A; --leaf:#6FC98A; --olive:#B5CF45; --olive-ink:#C7DE63;
    --accent:#5DBB7A; --accent-ink:#0E1813; --focus:#B5CF45;
    --e:#5DBB7A; --s:#E08A57; --g:#6FA8D8; --p:#A3A89C;
    --bad:#E0725F; --warn:#D9AE45; --good:#5DBB7A;
    --grid:#2F463A; --fill:rgba(93,187,122,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1813; --surface:#15231C; --surface-2:#1C2E25; --ink:#E3ECE5; --ink-2:#A3B5A9; --line:#2A3F33;
  --forest:#CFE3D4; --green:#5DBB7A; --leaf:#6FC98A; --olive:#B5CF45; --olive-ink:#C7DE63;
  --accent:#5DBB7A; --accent-ink:#0E1813; --focus:#B5CF45;
  --e:#5DBB7A; --s:#E08A57; --g:#6FA8D8; --p:#A3A89C;
  --bad:#E0725F; --warn:#D9AE45; --good:#5DBB7A;
  --grid:#2F463A; --fill:rgba(93,187,122,.25);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:24px 64px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;color:var(--forest)}
h1{font-size:clamp(28px,5vw,42px);line-height:1.12;font-weight:700;letter-spacing:-.01em}
h2{font-size:clamp(22px,3.4vw,28px);line-height:1.2;font-weight:600}
h3{font-size:18px;font-weight:600}
p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--olive-ink)}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* top bar */
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px;flex-wrap:wrap}
.brand-mark{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:600;color:var(--forest);font-size:15px}
.hex{width:22px;height:22px;flex:none}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step-chip{font:inherit;font-size:12px;cursor:pointer;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);background:var(--surface)}
.step-chip.on{background:var(--forest);border-color:var(--forest);color:var(--bg)}
.step-chip.done{border-color:var(--green);color:var(--green)}
.step-chip:disabled{cursor:not-allowed;opacity:.55}
.step-chip.on:disabled{opacity:1;cursor:default}
.step-chip:not(:disabled):not(.on):hover{background:var(--surface-2)}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:-12px 0 28px}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--olive));width:0;transition:width .35s ease}

/* intro */
.intro{display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center}
.intro .lede{font-size:19px;margin-top:14px;max-width:34em}
.facts{display:flex;gap:22px;margin:22px 0 26px;flex-wrap:wrap}
.facts div{display:flex;flex-direction:column}
.facts b{font-family:var(--font-display);font-size:24px;color:var(--green)}
.facts span{font-size:13px;color:var(--ink-2)}
.preview{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.preview .cap{font-size:12px;color:var(--ink-2);text-align:center;margin-top:4px}
.pillars-key{display:flex;gap:14px;flex-wrap:wrap;margin-top:22px;font-size:14px;color:var(--ink-2)}
.pillars-key span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}

/* buttons */
.btns{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:8px;padding:12px 20px;font-weight:600;font-size:16px;background:var(--accent);color:var(--accent-ink)}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--green);border:1.5px solid var(--green)}
.btn.link{background:none;color:var(--ink-2);padding:12px 6px;text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* section head */
.sec-head{display:flex;flex-direction:column;gap:6px;margin-bottom:22px}
.sec-head .scale{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-2);margin-top:6px}
.sec-head .scale b{font-family:var(--font-mono);color:var(--forest)}

/* question */
.dim-block{margin-bottom:28px}
.dim-title{display:flex;align-items:baseline;gap:10px;margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.dim-title .code{font-family:var(--font-mono);font-size:13px;color:var(--bg);background:var(--pc);padding:2px 7px;border-radius:5px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 14px;margin-bottom:14px}
.q.missing{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.q legend{font-weight:600;font-size:17px;padding:0;margin-bottom:12px;display:flex;gap:10px}
.q legend .qid{font-family:var(--font-mono);font-size:12px;color:var(--ink-2);padding-top:3px;flex:none}
.q fieldset{border:0;margin:0;padding:0;min-width:0}
.opts{display:grid;gap:6px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;padding:9px 10px;border-radius:8px;border:1px solid transparent;cursor:pointer;font-size:15.5px;line-height:1.4}
.opt:hover{background:var(--surface-2)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .lv{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--font-mono);font-size:13px;color:var(--ink-2);background:var(--surface)}
.opt input:checked + .lv{background:var(--green);border-color:var(--green);color:var(--accent-ink)}
.opt:has(input:checked){background:var(--surface-2);border-color:var(--green)}
.opt input:focus-visible + .lv{outline:3px solid var(--focus);outline-offset:2px}

.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:26px;flex-wrap:wrap}
.err{color:var(--bad);font-weight:600;font-size:15px}

/* contact form */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-weight:600;font-size:15px}
.field input,.field select{font:inherit;font-size:16px;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.field input.bad,.field select.bad{border-color:var(--bad)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.check input{margin-top:3px;width:20px;height:20px;flex:none;accent-color:var(--green);cursor:pointer}
.check{cursor:pointer}
.field .check{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.foot-check{font-size:13px;color:var(--ink-2);margin-top:4px}
.req{color:var(--bad)}

/* result */
.banner{background:var(--surface-2);border:1px dashed var(--olive);border-radius:8px;padding:10px 14px;font-size:14px;margin-bottom:18px}
.res-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:22px}
.res-grid{display:grid;grid-template-columns:1fr;gap:22px;align-items:start}
.radar-box #radar{max-width:720px;margin:0 auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.score-big{display:flex;align-items:baseline;gap:8px}
.score-big b{font-family:var(--font-display);font-size:56px;line-height:1;color:var(--forest)}
.score-big span{font-size:18px;color:var(--ink-2)}
.level-pill{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:999px;font-weight:700;font-size:14px;color:#fff}
.meter{height:10px;border-radius:99px;background:var(--surface-2);position:relative;margin:14px 0 4px;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:99px}
.pillar-rows{display:grid;gap:12px;margin-top:18px}
.prow{display:grid;grid-template-columns:96px 1fr 38px;gap:10px;align-items:center;font-size:15px}
.prow .bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.prow .bar i{display:block;height:100%;border-radius:99px}
.radar-box svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;justify-content:center;font-size:13px;color:var(--ink-2);flex-wrap:wrap;margin-top:4px}
.dims-table{width:100%;border-collapse:collapse;font-size:15px}
.dims-table td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.dims-table td.c{font-family:var(--font-mono);font-size:12px;color:var(--ink-2);width:34px}
.dims-table td.v{font-family:var(--font-mono);text-align:right;width:44px}
.dims-table td.b{width:34%}
.mini{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.mini i{display:block;height:100%;border-radius:99px}
.pains{display:grid;gap:12px;counter-reset:p}
.pain{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.pain:first-child{border-top:0;padding-top:4px}
.pain .rank{font-family:var(--font-display);font-size:28px;font-weight:700;color:var(--bad);line-height:1}
.pain h3{font-size:17px;margin-bottom:4px}
.pain .sol{margin-top:6px;font-size:15px}
.pain .sol b{color:var(--green)}
.section{margin-top:26px}
.internal{border:1.5px dashed var(--ink-2)}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 16px;font-size:15px}
.kv b{font-family:var(--font-mono);text-align:right}
.cta{background:var(--forest);color:var(--bg);border-radius:14px;padding:22px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.cta h3{color:var(--bg)}
.cta .btn{background:var(--olive);color:#16241D}
.copy-fallback{width:100%;min-height:140px;margin-top:10px;font-family:var(--font-mono);font-size:12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--forest);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:15px}


.logo{display:block;height:auto}
.brand-mark .logo{width:130px}
:root:not([data-theme="light"]) .logo{ }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .logo{filter:brightness(1.55) saturate(.9)} }
:root[data-theme="dark"] .logo{filter:brightness(1.55) saturate(.9)}
.sec-icon{width:56px;height:auto;flex:none}
.sec-top{display:flex;gap:16px;align-items:center}
.icon-row{display:flex;gap:10px;margin-top:26px;opacity:.9}
.icon-row img{width:40px;height:auto}
.site-foot{margin-top:56px;padding-top:22px;border-top:1px solid var(--line);display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.site-foot .logo{width:120px}
.foot-text{flex:1 1 280px;display:grid;gap:4px;font-size:13px;color:var(--ink-2)}
.foot-text b{color:var(--forest)}
.hexbg{position:fixed;inset:0 0 auto auto;width:min(420px,60vw);opacity:.07;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1}
@media (max-width:720px){
  .intro,.res-grid{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .preview{max-width:420px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

function setConsent(v){
  state.contact = Object.assign({}, state.contact, { lgpd: !!v }); save();
  const f = document.getElementById("lgpd-foot"); if (f) f.checked = !!v;
  const c = document.getElementById("lgpd"); if (c) c.checked = !!v;
}
function clampStep(){
  if (state.step >= 1 && state.step <= 5) state.step = Math.min(state.step, firstIncompleteStep());
  if (state.step === 6 && !state.submittedAt) state.step = firstIncompleteStep();
}
function save(){ if (state.example) return; try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ step:state.step, answers:state.answers, contact:state.contact, submittedAt:state.submittedAt })); } catch(e) {} }

const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmt = (n, d=1) => n == null || isNaN(n) ? "–" : n.toFixed(d).replace(".", ",");
const dimsOf = p => DATA.dims.filter(d => d.pilar === p);
const qsOf = dimId => DATA.qs.filter(q => q.dim === dimId);
const DIM_PILAR = Object.fromEntries(DATA.dims.map(d => [d.id, d.pilar]));
const qPilar = q => DIM_PILAR[q.dim];
const pillarColor = p => (PILLARS.find(x => x.key === p) || {}).color;

/* ---------------- scoring (mesma lógica da planilha) ---------------- */
function avg(a){ const v = a.filter(x => typeof x === "number"); return v.length ? v.reduce((s,x)=>s+x,0)/v.length : null; }
function round(n, d){ if (n == null) return null; const f = Math.pow(10,d); return Math.round(n*f)/f; }
function compute(answers){
  const dim = {};
  DATA.dims.forEach(d => { dim[d.id] = round(avg(qsOf(d.id).map(q => answers[q.id])), 1); });
  const esg = DATA.dims.filter(d => d.pilar !== "Prontidão").map(d => dim[d.id]);
  const mat = round(avg(esg), 2);
  const pil = {};
  ["Ambiental","Social","Governança","Prontidão"].forEach(p => pil[p] = round(avg(dimsOf(p).map(d => dim[d.id])), 2));
  const op = mat == null ? null : 6 - mat;
  const pr = pil["Prontidão"];
  const pot = (op == null || pr == null) ? null : round(op*PARAMS.pesoOportunidade + pr*PARAMS.pesoProntidao, 2);
  const cls = pot == null ? "" : pot >= PARAMS.limiteQuente ? "Quente (SQL)" : pot >= PARAMS.limiteMorno ? "Morno (MQL)" : "Nutrir";
  const pains = DATA.dims.filter(d => d.pilar !== "Prontidão" && dim[d.id] != null)
    .map((d,i) => ({ d, v: dim[d.id], i })).sort((a,b) => a.v - b.v || a.i - b.i).slice(0,3);
  return { dim, mat, pct: mat == null ? null : (mat-1)/4, pil, op, pr, pot, cls, pains };
}
function levelOf(v){ if (v == null) return null; const i = Math.min(4, Math.max(0, Math.round(v) - 1)); return { i, name: LEVELS[i] }; }
function levelColor(v){ return v < 2.5 ? "var(--bad)" : v < 3.5 ? "var(--warn)" : "var(--good)"; }

/* ---------------- radar (gráfico teia) ---------------- */
function radarSVG(scores, { compact=false, showLabels=true } = {}){
  const W = compact ? 360 : 680, H = compact ? 340 : 520;
  const cx = W/2, cy = H/2 + (compact ? 0 : 4), R = compact ? 118 : 168;
  const n = DATA.dims.length, ang = i => -Math.PI/2 + i*2*Math.PI/n;
  const pt = (i, v) => [cx + Math.cos(ang(i))*R*v/5, cy + Math.sin(ang(i))*R*v/5];
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico teia com as notas de 1 a 5 das ${n} dimensões">`;
  for (let k=1;k<=5;k++){
    const ring = DATA.dims.map((_,i) => pt(i,k).map(x=>x.toFixed(1)).join(",")).join(" ");
    s += `<polygon points="${ring}" fill="none" stroke="var(--grid)" stroke-width="${k===5?1.4:1}"/>`;
  }
  DATA.dims.forEach((d,i) => { const [x,y] = pt(i,5); s += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--grid)"/>`; });
  if (!compact) for (let k=1;k<=5;k++){ const [x,y] = pt(0,k); s += `<text x="${x+5}" y="${y+4}" font-size="11" fill="var(--ink-2)" font-family="IBM Plex Mono, monospace">${k}</text>`; }
  const vals = DATA.dims.map(d => scores[d.id] ?? 0);
  const poly = vals.map((v,i) => pt(i, Math.max(v,0)).map(x=>x.toFixed(1)).join(",")).join(" ");
  s += `<polygon points="${poly}" fill="var(--fill)" stroke="var(--green)" stroke-width="2.5" stroke-linejoin="round"/>`;
  vals.forEach((v,i) => { const [x,y] = pt(i,v); const d = DATA.dims[i];
    s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${compact?3.5:4.5}" fill="${pillarColor(d.pilar)}" stroke="var(--surface)" stroke-width="1.5"><title>${esc(d.id+" · "+d.nome)}: ${fmt(v)}</title></circle>`; });
  if (showLabels){
    DATA.dims.forEach((d,i) => {
      const a = ang(i), lx = cx + Math.cos(a)*(R + (compact?14:18)), ly = cy + Math.sin(a)*(R + (compact?14:18));
      const c = Math.cos(a), anchor = Math.abs(c) < .2 ? "middle" : c > 0 ? "start" : "end";
      const dy = Math.sin(a) > .5 ? 12 : Math.sin(a) < -.5 ? -4 : 4;
      if (compact){
        s += `<text x="${lx.toFixed(1)}" y="${(ly+dy).toFixed(1)}" text-anchor="${anchor}" font-size="11" font-family="IBM Plex Mono, monospace" fill="${pillarColor(d.pilar)}">${d.id}</text>`;
      } else {
        s += `<text x="${lx.toFixed(1)}" y="${(ly+dy).toFixed(1)}" text-anchor="${anchor}" font-size="12.5" font-family="Source Sans 3, sans-serif" fill="var(--ink)"><tspan font-family="IBM Plex Mono, monospace" font-size="11" fill="${pillarColor(d.pilar)}">${d.id} </tspan>${esc(d.curto)}</text>`;
      }
    });
  }
  return s + `</svg>`;
}

/* ---------------- render ---------------- */
function chips(){
  const maxStep = state.example ? 6 : (state.submittedAt ? 6 : firstIncompleteStep());
  $("#chips").innerHTML = STEPS.map((t,i) => {
    const cls = i===state.step ? "on" : (i < maxStep || (i===6 && state.submittedAt)) ? "done" : "";
    const ok = !state.example && i !== state.step && i <= maxStep;
    return `<button type="button" class="step-chip ${cls}" data-step="${i}" ${ok ? "" : "disabled"} ${i===state.step?'aria-current="step"':""}>${t}</button>`;
  }).join("");
  $("#chips").querySelectorAll("button:not([disabled])").forEach(b => b.onclick = () => go(+b.dataset.step));
  const pb = $("#progress");
  pb.hidden = state.step === 0 || state.step === 6;
  const answered = Object.keys(state.answers).length;
  $("i", pb).style.width = Math.round(answered / DATA.qs.length * 100) + "%";
}
function go(step){ state.step = step; save(); render(); window.scrollTo({ top:0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); }

function render(){
  chips();
  const app = $("#app");
  if (state.step === 0) return renderIntro(app);
  if (state.step >= 1 && state.step <= 4) return renderPillar(app, PILLARS[state.step-1]);
  if (state.step === 5) return renderContact(app);
  return renderResult(app);
}

function exampleAnswers(){ const a = {}; DATA.qs.forEach(q => a[q.id] = q.ex); return a; }

function renderIntro(app){
  const answered = Object.keys(state.answers).length;
  const ex = compute(exampleAnswers());
  app.innerHTML = `
  <section class="intro">
    <div>
      <p class="eyebrow">Diagnóstico ESG para organizações</p>
      <h1 style="margin-top:10px">Onde sua organização está em ESG, e por onde começar</h1>
      <p class="lede muted">Responda 42 perguntas sobre resíduos, áreas verdes, clima, engajamento, governança e prontidão. Ao final, você recebe o gráfico teia da sua maturidade ESG e as 3 lacunas prioritárias, com a solução indicada para cada uma.</p>
      <div class="facts">
        <div><b class="num">42</b><span>perguntas</span></div>
        <div><b class="num">14</b><span>dimensões</span></div>
        <div><b class="num">~12</b><span>minutos</span></div>
      </div>
      <div class="btns">
        <button class="btn" id="start">${answered ? "Continuar de onde parei" : "Começar diagnóstico"}</button>
        <button class="btn ghost" id="demo">Ver um resultado de exemplo</button>
        ${answered ? `<button class="btn link" id="reset">Recomeçar do zero</button>` : ""}
      </div>
      <div class="icon-row" aria-hidden="true">${["maos","carrinho","concha","coracao","tigela","globo"].map(k => `<img src="${ICONS[k]}" alt="">`).join("")}</div>
    </div>
    <figure class="preview" style="margin:0">
      ${radarSVG(ex.dim, { compact:true })}
      <figcaption class="cap">Exemplo fictício de resultado · Maturidade ESG ${fmt(ex.mat,2)} de 5</figcaption>
    </figure>
  </section>`;
  $("#start").onclick = () => go(firstIncompleteStep());
  $("#demo").onclick = () => { state = { step:6, answers: exampleAnswers(), contact: { empresa:"Exemplo Incorporadora Ltda.", segmento:"Incorporadora", nome:"Pessoa de exemplo" }, example:true }; render(); window.scrollTo(0,0); };
  const r = $("#reset"); if (r) r.onclick = () => { state = { step:0, answers:{}, contact:{}, example:false }; try{localStorage.removeItem(DRAFT_KEY);}catch(e){} render(); };
}
function firstIncompleteStep(){
  for (let i=0;i<4;i++){ const p = PILLARS[i].key; if (DATA.qs.some(q => qPilar(q) === p && state.answers[q.id] == null)) return i+1; }
  return 5;
}

function renderPillar(app, P){
  const dims = dimsOf(P.key);
  const intro = {
    "Ambiental":"Como a organização trata resíduos, áreas verdes, clima e a cadeia de alimentos.",
    "Social":"Relação com a comunidade, inclusão e educação socioambiental.",
    "Governança":"Estratégia, compliance, dados e reputação ligados a ESG.",
    "Prontidão":"Orçamento, patrocínio e prazo para implantar uma iniciativa ESG. Aqui, 5 indica maior prontidão."
  }[P.key];
  app.innerHTML = `
  <section>
    <div class="sec-head">
      <div class="sec-top"><img class="sec-icon" src="${ICONS[P.icon]}" alt="">
      <div><p class="eyebrow">Etapa ${state.step} de 5 · ${esc(P.label)}</p>
      <h2 style="margin-top:4px">${esc(intro)}</h2></div></div>
      <p class="muted small">Escolha a opção que melhor descreve a organização hoje.</p>
    </div>
    ${dims.map(d => `
      <div class="dim-block" style="--pc:${P.color}">
        <h3 class="dim-title"><span class="code">${d.id}</span>${esc(d.nome)}</h3>
        ${qsOf(d.id).map(q => `
          <div class="q" id="q-${q.id}">
            <fieldset>
              <legend><span class="qid">${q.id}</span><span>${esc(q.p)}</span></legend>
              <div class="opts">
                ${q.n.map((t,k) => `
                  <label class="opt">
                    <input type="radio" name="${q.id}" id="${q.id}-${k+1}" value="${k+1}" ${state.answers[q.id]===k+1?"checked":""}>
                    <span class="lv">${k+1}</span><span>${esc(t)}</span>
                  </label>`).join("")}
              </div>
            </fieldset>
          </div>`).join("")}
      </div>`).join("")}
    <div class="nav">
      <button class="btn link" id="back">← Voltar</button>
      <span class="err" id="err" role="alert"></span>
      <button class="btn" id="next">${state.step === 4 ? "Seguir para o contato →" : "Próxima etapa →"}</button>
    </div>
  </section>`;
  app.querySelectorAll('input[type=radio]').forEach(inp => inp.addEventListener("change", () => {
    state.answers[inp.name] = +inp.value; save(); chips();
    const box = document.getElementById("q-"+inp.name); box && box.classList.remove("missing");
  }));
  $("#back").onclick = () => go(state.step - 1);
  $("#next").onclick = () => {
    const missing = DATA.qs.filter(q => qPilar(q) === P.key && state.answers[q.id] == null);
    app.querySelectorAll(".q").forEach(el => el.classList.remove("missing"));
    if (missing.length){
      missing.forEach(q => document.getElementById("q-"+q.id).classList.add("missing"));
      $("#err").textContent = missing.length === 1 ? "Falta responder 1 pergunta, destacada em vermelho." : `Faltam ${missing.length} perguntas, destacadas em vermelho.`;
      document.getElementById("q-"+missing[0].id).scrollIntoView({ behavior:"smooth", block:"center" });
      return;
    }
    go(state.step + 1);
  };
}

function renderContact(app){
  const c = state.contact;
  const segOpts = DATA.segs.map(s => `<option ${c.segmento===s.s?"selected":""}>${esc(s.s)}</option>`).join("");
  const porte = ["Micro/Pequeno","Médio","Grande","Público"].map(p => `<option ${c.porte===p?"selected":""}>${p}</option>`).join("");
  app.innerHTML = `
  <section>
    <div class="sec-head">
      <div class="sec-top"><img class="sec-icon" src="${ICONS.tigela}" alt="">
      <div><p class="eyebrow">Etapa 5 de 5 · Contato</p>
      <h2 style="margin-top:4px">Para quem enviamos o diagnóstico?</h2></div></div>
      <p class="muted small">Campos com <span class="req">*</span> são obrigatórios.</p>
    </div>
    <form id="cf" novalidate>
      <div class="form-grid">
        <div class="field"><label for="empresa">Organização <span class="req">*</span></label><input id="empresa" name="empresa" autocomplete="organization" value="${esc(c.empresa)}"></div>
        <div class="field"><label for="segmento">Segmento <span class="req">*</span></label><select id="segmento" name="segmento"><option value="">Selecione</option>${segOpts}</select></div>
        <div class="field"><label for="porte">Porte</label><select id="porte" name="porte"><option value="">Selecione</option>${porte}</select></div>
        <div class="field"><label for="municipio">Município / bairro</label><input id="municipio" name="municipio" value="${esc(c.municipio)}"></div>
        <div class="field full"><label for="pessoas">Pessoas impactadas (colaboradores, condôminos, alunos ou participantes por ano)</label><input id="pessoas" name="pessoas" inputmode="numeric" value="${esc(c.pessoas)}"></div>
        <div class="field"><label for="nome">Seu nome <span class="req">*</span></label><input id="nome" name="nome" autocomplete="name" value="${esc(c.nome)}"></div>
        <div class="field"><label for="cargo">Cargo</label><input id="cargo" name="cargo" autocomplete="organization-title" value="${esc(c.cargo)}"></div>
        <div class="field"><label for="email">E-mail corporativo <span class="req">*</span></label><input id="email" name="email" type="email" autocomplete="email" value="${esc(c.email)}"></div>
        <div class="field"><label for="fone">Telefone / WhatsApp</label><input id="fone" name="fone" type="tel" autocomplete="tel" value="${esc(c.fone)}"></div>
        <div class="field full"><label class="check" for="lgpd"><input type="checkbox" id="lgpd" name="lgpd" ${c.lgpd?"checked":""}><span>Autorizo a Santa Food Tech a usar estes dados para entrar em contato sobre a Smart EcoVila, conforme a LGPD (Lei 13.709/2018). <span class="req">*</span></span></label></div>
      </div>
      <div class="nav">
        <button type="button" class="btn link" id="back">← Voltar</button>
        <span class="err" id="err" role="alert"></span>
        <button type="submit" class="btn">Ver meu diagnóstico →</button>
      </div>
    </form>
  </section>`;
  const form = $("#cf");
  const read = () => { const o = {}; ["empresa","segmento","porte","municipio","pessoas","nome","cargo","email","fone"].forEach(k => o[k] = form[k].value.trim()); o.lgpd = form.lgpd.checked; return o; };
  form.addEventListener("input", () => { state.contact = read(); save(); });
  form.lgpd.addEventListener("change", () => setConsent(form.lgpd.checked));
  $("#back").onclick = () => { state.contact = read(); go(4); };
  form.addEventListener("submit", e => {
    e.preventDefault();
    const o = read(); state.contact = o;
    const bad = [];
    ["empresa","segmento","nome"].forEach(k => { if (!o[k]) bad.push(k); });
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(o.email)) bad.push("email");
    form.querySelectorAll(".bad").forEach(el => el.classList.remove("bad"));
    bad.forEach(k => form[k].classList.add("bad"));
    if (bad.length){ $("#err").textContent = "Preencha os campos destacados (e-mail em formato válido)."; form[bad[0]].focus(); return; }
    if (!o.lgpd){ $("#err").textContent = "Marque a autorização de uso dos dados para ver o resultado."; form.lgpd.focus(); return; }
    state.submittedAt = new Date().toISOString();
    sendLead(); go(6);
  });
}

function payload(){
  const r = compute(state.answers);
  const seg = DATA.segs.find(s => s.s === state.contact.segmento);
  return { enviadoEm: state.submittedAt || new Date().toISOString(), contato: state.contact,
    verticalRecomendada: seg ? seg.v : null, respostas: state.answers, notasDimensoes: r.dim,
    indices: { maturidadeESG: r.mat, maturidadePct: r.pct, pilares: r.pil, oportunidade: r.op, prontidao: r.pr, potencialMEVC: r.pot, classificacao: r.cls },
    top3Dores: r.pains.map(p => ({ dimensao: p.d.id + " " + p.d.nome, nota: p.v, solucao: p.d.solucao })) };
}
function sendLead(){
  if (!WEBHOOK_URL) return;
  try { fetch(WEBHOOK_URL, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(payload()) }).catch(()=>{}); } catch(e) {}
}

function renderResult(app){
  const r = compute(state.answers);
  if (r.mat == null){ state.step = 0; return render(); }
  const lv = levelOf(r.mat);
  const seg = DATA.segs.find(s => s.s === state.contact.segmento);
  const internal = location.hash === "#interno";
  const org = state.contact.empresa || "Sua organização";
  app.innerHTML = `
  ${state.example ? `<div class="banner">Exemplo fictício para demonstração. <button class="btn link" id="exit" style="padding:0">Fazer o meu diagnóstico</button></div>` : ""}
  <section>
    <div class="res-head">
      <div>
        <p class="eyebrow">Diagnóstico ESG · ${new Date(state.submittedAt || Date.now()).toLocaleDateString("pt-BR")}</p>
        <h1 style="margin-top:8px">${esc(org)}</h1>
      </div>
      <div class="btns">
        <button class="btn ghost" id="copy">Copiar resumo</button>
      </div>
    </div>
    <div class="res-grid">
      <div class="panel radar-box">
        <h3>Gráfico teia · 14 dimensões</h3>
        <p class="muted small" style="margin:4px 0 6px">Escala de 1 (inexistente) a 5 (referência). Quanto maior a área, maior a maturidade.</p>
        <div id="radar"></div>
        <div class="legend">${PILLARS.map(p => `<span><i class="dot" style="background:${p.color}"></i> ${p.code} · ${p.label}</span>`).join("")}</div>
      </div>
      <div class="panel">
        <p class="eyebrow">Índice de Maturidade ESG</p>
        <div class="score-big" style="margin-top:8px"><b class="num">${fmt(r.mat,2)}</b><span>de 5</span></div>
        <div class="meter" aria-hidden="true"><i style="width:${Math.round(r.pct*100)}%;background:${levelColor(r.mat)}"></i></div>
        <p class="small muted"><span class="num">${Math.round(r.pct*100)}%</span> do nível de referência</p>
        <span class="level-pill" style="background:${levelColor(r.mat)}">Nível ${lv.i+1} · ${lv.name}</span>
        <div class="pillar-rows">
          ${PILLARS.map(p => { const v = r.pil[p.key]; return `
            <div class="prow"><span>${p.key === "Prontidão" ? "Prontidão" : p.label}</span>
              <span class="bar"><i style="width:${(v/5*100).toFixed(0)}%;background:${p.color}"></i></span>
              <b class="num">${fmt(v)}</b></div>`; }).join("")}
        </div>
        <p class="small muted" style="margin-top:14px">Maturidade = média das dimensões Ambiental, Social e Governança. Prontidão mede orçamento, patrocínio e prazo e não entra na média.</p>
      </div>
    </div>

    <div class="panel section">
      <p class="eyebrow">Top 3 lacunas prioritárias</p>
      <h2 style="margin:6px 0 12px">Por onde começar</h2>
      <div class="pains">
        ${r.pains.map((p,i) => `
          <div class="pain">
            <span class="rank num">${i+1}</span>
            <div>
              <h3>${p.d.id} · ${esc(p.d.nome)} <span class="num muted" style="font-weight:500">(${fmt(p.v)})</span></h3>
              <p class="muted">${esc(p.d.dor)}</p>
              <p class="sol"><b>Solução Smart EcoVila:</b> ${esc(p.d.solucao)}</p>
            </div>
          </div>`).join("")}
      </div>
    </div>

    <div class="panel section">
      <h3 style="margin-bottom:8px">Notas por dimensão</h3>
      <div style="overflow-x:auto">
      <table class="dims-table">
        <tbody>
          ${DATA.dims.map(d => { const v = r.dim[d.id]; return `
            <tr><td class="c" style="color:${pillarColor(d.pilar)}">${d.id}</td><td>${esc(d.nome)}</td>
            <td class="b"><div class="mini"><i style="width:${(v/5*100).toFixed(0)}%;background:${pillarColor(d.pilar)}"></i></div></td>
            <td class="v">${fmt(v)}</td></tr>`; }).join("")}
        </tbody>
      </table>
      </div>
    </div>

    <div class="cta section">
      <div>
        <h3>Próximo passo: devolutiva com um especialista</h3>
        <p style="opacity:.85;margin-top:4px">${seg ? `Para o seu segmento, a frente indicada é <b>${esc(seg.v)}</b>. ` : ""}Em 30 minutos apresentamos o plano para as suas 3 lacunas prioritárias.</p>
      </div>
      <button class="btn" id="copy2">Copiar resumo para enviar</button>
    </div>
    <div id="copybox"></div>

    ${internal ? `
    <div class="panel section internal">
      <p class="eyebrow">Uso interno MEVC · não exibir ao lead</p>
      <div class="kv" style="margin-top:10px">
        <span>Índice de Oportunidade (6 − maturidade)</span><b>${fmt(r.op,2)}</b>
        <span>Índice de Prontidão</span><b>${fmt(r.pr,2)}</b>
        <span>Índice Potencial MEVC (pesos ${PARAMS.pesoOportunidade}/${PARAMS.pesoProntidao})</span><b>${fmt(r.pot,2)}</b>
        <span>Classificação do lead</span><b>${esc(r.cls)}</b>
        <span>Vertical recomendada</span><b style="font-family:var(--font-body)">${esc(seg ? seg.v : "–")}</b>
      </div>
    </div>` : ""}

    <div class="nav">
      <button class="btn link" id="edit">← Revisar respostas</button>
      <button class="btn link" id="new">Novo diagnóstico</button>
    </div>
  </section>`;
  const drawRadar = () => { const box = $("#radar"); if (box) box.innerHTML = radarSVG(r.dim, { compact: box.clientWidth < 520 }); };
  drawRadar(); window.onresize = drawRadar;
  const doCopy = () => copySummary(r, seg);
  $("#copy").onclick = doCopy; $("#copy2").onclick = doCopy;
  $("#edit").onclick = () => { if (state.example){ state = { step:1, answers:{}, contact:{}, example:false }; render(); } else go(1); };
  $("#new").onclick = () => { state = { step:0, answers:{}, contact:{}, example:false }; try{localStorage.removeItem(DRAFT_KEY);}catch(e){} render(); window.scrollTo(0,0); };
  const ex = $("#exit"); if (ex) ex.onclick = () => { state = { step:0, answers:{}, contact:{}, example:false }; try{ const s = JSON.parse(localStorage.getItem(DRAFT_KEY)||"null"); if (s) Object.assign(state, s); }catch(e){} state.step = 0; render(); };
}

function summaryText(r, seg){
  const c = state.contact;
  return [
    `Diagnóstico ESG · Smart EcoVila / MEVC`,
    `Organização: ${c.empresa || "-"} | Segmento: ${c.segmento || "-"}${seg ? " | Vertical: " + seg.v : ""}`,
    `Contato: ${c.nome || "-"}${c.cargo ? " (" + c.cargo + ")" : ""} | ${c.email || "-"}${c.fone ? " | " + c.fone : ""}`,
    `Maturidade ESG: ${fmt(r.mat,2)} de 5 (${Math.round(r.pct*100)}%)`,
    `Pilares: Ambiental ${fmt(r.pil["Ambiental"])} · Social ${fmt(r.pil["Social"])} · Governança ${fmt(r.pil["Governança"])} · Prontidão ${fmt(r.pil["Prontidão"])}`,
    `Notas: ` + DATA.dims.map(d => `${d.id} ${fmt(r.dim[d.id])}`).join(" · "),
    `Top 3 lacunas:`,
    ...r.pains.map((p,i) => `${i+1}. ${p.d.id} ${p.d.nome} (${fmt(p.v)}) → ${p.d.solucao}`)
  ].join("\n");
}
function copySummary(r, seg){
  const text = summaryText(r, seg);
  const fallback = () => { const box = $("#copybox"); box.innerHTML = `<textarea class="copy-fallback" id="copyarea" aria-label="Resumo do diagnóstico" readonly></textarea>`; const ta = $("#copyarea"); ta.value = text; ta.focus(); ta.select(); toast("Resumo selecionado. Use Ctrl+C ou Copiar."); };
  try {
    navigator.clipboard.writeText(text).then(() => toast("Resumo copiado"), fallback);
  } catch(e){ fallback(); }
}
let tt; function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2400); }

clampStep();
{ const f = document.getElementById("lgpd-foot"); f.checked = !!(state.contact && state.contact.lgpd); f.addEventListener("change", () => setConsent(f.checked)); }
window.addEventListener("hashchange", () => { if (state.step === 6) render(); });
render();
</script>

</body>
</html>
